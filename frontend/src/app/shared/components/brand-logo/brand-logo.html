<div class="csm-brand" [class.is-dark]="isDarkMode()" [attr.data-variant]="variant" [attr.data-size]="size">
  <span class="csm-logo-pill" title="CSM">
    <img
      src="/assets/images/csm-logo.png"
      alt="CSM Logo"
      class="csm-logo-img csm-logo-light"
      decoding="async" />
    <img
      src="/assets/images/csm-logo-dark.png"
      alt="CSM Logo"
      class="csm-logo-img csm-logo-dark"
      decoding="async" />
  </span>

  <div class="csm-brand-copy">
    <div class="csm-brand-row">
      <span class="csm-platform-name">ASE Assessment Tool</span>
      @if (badgeText) {
        <span class="csm-brand-badge">{{ badgeText }}</span>
      }
    </div>
    @if (showSubtitle && subtitle) {
      <small class="csm-brand-sub">{{ subtitle }}</small>
    }
  </div>
</div>
